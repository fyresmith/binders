name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # as the e2e workflow; 20 decodes windows-1252 as Latin-1, and the RTF import tests fail on it
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
