name: Release

# Runs only from a tag that `npm run release` pushed (AGENTS.md, "Releases": the maintainer calls a release). No other
# trigger belongs here: a push to main, a green suite or a schedule never cuts a release.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write # signs the build provenance
  attestations: write
  actions: read # to ask whether the e2e suite passed (the gate below)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find the previous release for the notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # the e2e suite must have passed for the commit this release was made from (its parent: the release commit changes
      # only the version files and the changelog), unless the release was made with --skip-suite, whose reason is in the
      # commit's message and goes into the notes
      - name: Check the e2e suite passed for the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.mjs "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/skipped.txt"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: |
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # a signed record that these files were built from this commit by this workflow (see "gh attestation verify")
      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      # every release is a full one, published as the latest: Obsidian's directory and GitHub's "latest release" both
      # pass over drafts and pre-releases, and to them a pre-release is no release at all (the first two betas were)
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--latest"
          # the notes are this version's section of CHANGELOG.md: from its "## x.y.z" heading to the next "## "
          awk -v v="## ${GITHUB_REF_NAME}" '/^## / { if (f) exit; if ($0 == v || index($0, v " ") == 1) f = 1 } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what's new." > notes.md
          # (a release made without the suite says so, with the reason)
          if [ -s "${RUNNER_TEMP}/skipped.txt" ]; then printf '\n> Published without the e2e suite. Reason: %s\n' "$(cat "${RUNNER_TEMP}/skipped.txt")" >> notes.md; fi
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            $flags --title "${GITHUB_REF_NAME}" --notes-file notes.md
